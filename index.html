<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge — Your Learning Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body>

  <!-- ── SIDEBAR ─────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">SB</div>
      <span class="logo-name">SkillBridge</span>
    </div>

    <div class="nav-section">Menu</div>
    <div class="nav-item active" data-page="dashboard" onclick="Router.go('dashboard', this)">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
      <span class="nav-badge" id="nav-badge-count">0</span>
    </div>
    <div class="nav-item" data-page="settings" onclick="Router.go('settings', this)">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </div>

    <div class="sidebar-footer">
      <div class="theme-toggle" onclick="UI.toggleTheme()">
        <span style="display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          Dark mode
        </span>
        <div class="toggle-pill" id="theme-pill"><div class="toggle-knob"></div></div>
      </div>
    </div>
  </aside>

  <!-- ── HAMBURGER (mobile) ──────────────── -->
  <button class="sidebar-hamburger" id="hamburger" onclick="UI.toggleSidebar()" aria-label="Toggle menu">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </button>

  <!-- ── MAIN ───────────────────────────── -->
  <div class="main">

    <!-- Top Bar -->
    <header class="topbar">
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="add-skill-btn" onclick="UI.openModal('modal-add-skill')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Add Skill
        </button>
      </div>
    </header>

    <!-- Page: Dashboard -->
    <div class="page active" id="page-dashboard">
      <!-- injected by dashboard.js -->
    </div>

    <!-- Page: Detail -->
    <div class="page" id="page-detail">
      <!-- injected by detail.js -->
    </div>

    <!-- Page: Settings -->
    <div class="page" id="page-settings">
      <!-- injected by settings (inline in pages.js) -->
    </div>

  </div><!-- /.main -->

  <!-- ── MODAL: Add Skill ────────────────── -->
  <div class="modal-overlay" id="modal-add-skill">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title">Add New Skill</div>
          <div class="modal-sub">Define what you want to learn</div>
        </div>
        <button class="modal-close" onclick="UI.closeModal('modal-add-skill')">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="field">
        <label>Skill Name *</label>
        <input type="text" id="skill-name-input" placeholder="e.g. TypeScript, Machine Learning…" maxlength="60" />
      </div>
      <div class="field">
        <label>Choose Icon</label>
        <div class="icon-picker" id="icon-picker">
          <div class="icon-opt selected" data-icon="💻" onclick="UI.selectIcon(this)">💻</div>
          <div class="icon-opt" data-icon="🎨" onclick="UI.selectIcon(this)">🎨</div>
          <div class="icon-opt" data-icon="🧠" onclick="UI.selectIcon(this)">🧠</div>
          <div class="icon-opt" data-icon="📊" onclick="UI.selectIcon(this)">📊</div>
          <div class="icon-opt" data-icon="🔧" onclick="UI.selectIcon(this)">🔧</div>
          <div class="icon-opt" data-icon="📱" onclick="UI.selectIcon(this)">📱</div>
          <div class="icon-opt" data-icon="🌐" onclick="UI.selectIcon(this)">🌐</div>
          <div class="icon-opt" data-icon="🔬" onclick="UI.selectIcon(this)">🔬</div>
          <div class="icon-opt" data-icon="🎵" onclick="UI.selectIcon(this)">🎵</div>
          <div class="icon-opt" data-icon="✍️" onclick="UI.selectIcon(this)">✍️</div>
          <div class="icon-opt" data-icon="📸" onclick="UI.selectIcon(this)">📸</div>
          <div class="icon-opt" data-icon="⚡" onclick="UI.selectIcon(this)">⚡</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="field" style="margin-bottom:0">
          <label>Category</label>
          <select id="skill-category">
            <option value="Tech">Tech</option>
            <option value="Design">Design</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
            <option value="Language">Language</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>Difficulty</label>
          <select id="skill-difficulty">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="UI.closeModal('modal-add-skill')">Cancel</button>
        <button class="btn btn-primary" onclick="SkillActions.save()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          Create Skill
        </button>
      </div>
    </div>
  </div>

  <!-- ── MODAL: Add Step ─────────────────── -->
  <div class="modal-overlay" id="modal-add-step">
    <div class="modal step-modal">
      <div class="modal-header">
        <div>
          <div class="modal-title">Add Learning Step</div>
          <div class="modal-sub" id="step-modal-phase">Beginner Phase</div>
        </div>
        <button class="modal-close" onclick="UI.closeModal('modal-add-step')">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="field">
        <label>Step Title *</label>
        <input type="text" id="step-title-input" placeholder="e.g. Learn the basics of variables…" maxlength="80" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="step-desc-input" placeholder="What will you learn or do in this step?"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="UI.closeModal('modal-add-step')">Cancel</button>
        <button class="btn btn-primary" onclick="StepActions.save()">Add Step</button>
      </div>
    </div>
  </div>

  <!-- ── CONTEXT MENU ────────────────────── -->
  <div class="ctx-menu" id="ctx-menu">
    <div class="ctx-item" id="ctx-open">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open Skill
    </div>
    <div class="ctx-item danger" id="ctx-delete">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
      Delete Skill
    </div>
  </div>

  <!-- ── TOAST CONTAINER ─────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ── SCRIPTS (order matters) ─────────── -->
  <script src="assets/js/state.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/detail.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
